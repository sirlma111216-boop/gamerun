services:
  - type: web
    name: lumi-run
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.16.0
      - key: ENABLE_TEST_ROOMS
        value: "false"
